# =============================================================================
# DOCKER COMPOSE FOR GOOGLE CLOUD RUN (LOCAL TESTING)
# =============================================================================
# This docker-compose is for local testing of the cloud configuration.
# In production, each service runs independently on Cloud Run.
# 
# Key differences from local development:
# - No Redis/Celery (training is synchronous with extended timeouts)
# - GCS for model storage instead of Docker volumes
# - Services are stateless and can scale independently
# =============================================================================

services:
  # --- API Gateway ---
  api-gateway:
    build:
      context: ./Backend
      dockerfile: api_gateway/Dockerfile.cloud
    container_name: cloud_api_gateway
    ports:
      - "8000:8000"
    environment:
      RF_SERVICE_URL: http://model-rf:8001
      LSTM_SERVICE_URL: http://model-lstm:8002
      XGB_SERVICE_URL: http://model-xgb:8003
      PROPHET_SERVICE_URL: http://model-prophet:8004
      SHAP_SERVICE_URL: http://shap-explainer:8005
      ENSEMBLE_SERVICE_URL: http://ensemble-model:8006
      ENVIRONMENT: cloud
    depends_on:
      - model-rf
      - model-lstm
      - model-xgb
      - model-prophet
    networks:
      - stockpredictor-cloud

  # --- Random Forest Service ---
  model-rf:
    build:
      context: ./Backend
      dockerfile: services/model_rf/Dockerfile.cloud
    container_name: cloud_rf_api
    expose:
      - "8001"
    environment:
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-stocktime-predictor-models}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - ENVIRONMENT=cloud
      - PYTHONPATH=/app
    volumes:
      # For local testing without GCS, mount a local models directory
      - ./models/rf:/app/models/rf
    networks:
      - stockpredictor-cloud

  # --- LSTM Service ---
  model-lstm:
    build:
      context: ./Backend
      dockerfile: services/model_lstm/Dockerfile.cloud
    container_name: cloud_lstm_api
    expose:
      - "8002"
    environment:
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-stocktime-predictor-models}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - ENVIRONMENT=cloud
      - PYTHONPATH=/app
    volumes:
      - ./models/lstm:/app/models/lstm
    networks:
      - stockpredictor-cloud

  # --- XGBoost Service ---
  model-xgb:
    build:
      context: ./Backend
      dockerfile: services/model_xgb/Dockerfile.cloud
    container_name: cloud_xgb_api
    expose:
      - "8003"
    environment:
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-stocktime-predictor-models}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - ENVIRONMENT=cloud
      - PYTHONPATH=/app
    volumes:
      - ./models/xgb:/app/models/xgb
    networks:
      - stockpredictor-cloud

  # --- Prophet Service ---
  model-prophet:
    build:
      context: ./Backend
      dockerfile: services/model_prophet/Dockerfile.cloud
    container_name: cloud_prophet_api
    expose:
      - "8004"
    environment:
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-stocktime-predictor-models}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - ENVIRONMENT=cloud
      - PYTHONPATH=/app
    volumes:
      - ./models/prophet:/app/models/prophet
    networks:
      - stockpredictor-cloud

  # --- SHAP Explainer Service ---
  shap-explainer:
    build:
      context: ./Backend
      dockerfile: services/shap_explainer/Dockerfile.cloud
    container_name: cloud_shap_api
    expose:
      - "8005"
    environment:
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-stocktime-predictor-models}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - ENVIRONMENT=cloud
      - PYTHONPATH=/app
    volumes:
      - ./models/rf:/app/models/rf
      - ./models/xgb:/app/models/xgb
    networks:
      - stockpredictor-cloud

  # --- Ensemble Service ---
  ensemble-model:
    build:
      context: ./Backend
      dockerfile: services/model_ensemble/Dockerfile.cloud
    container_name: cloud_ensemble_api
    expose:
      - "8006"
    environment:
      - RF_SERVICE_URL=http://model-rf:8001
      - LSTM_SERVICE_URL=http://model-lstm:8002
      - XGB_SERVICE_URL=http://model-xgb:8003
      - PROPHET_SERVICE_URL=http://model-prophet:8004
      - ENVIRONMENT=cloud
      - PYTHONPATH=/app
    depends_on:
      - model-rf
      - model-lstm
      - model-xgb
      - model-prophet
    networks:
      - stockpredictor-cloud

networks:
  stockpredictor-cloud:
    driver: bridge
