# =============================================================================
# Cloud Build Configuration for StockTime Predictor
# =============================================================================
# This file defines the build and deployment steps for Google Cloud Run
# 
# Usage:
#   gcloud builds submit --config cloudbuild.yaml
#
# Prerequisites:
#   1. Enable Cloud Build, Cloud Run, and Container Registry APIs
#   2. Grant Cloud Build service account permissions to deploy to Cloud Run
#   3. Create a GCS bucket for model storage
# =============================================================================

substitutions:
  _REGION: us-central1
  _GCS_BUCKET: stocktime-predictor-models

steps:
  # =============================================================================
  # Build Docker Images
  # =============================================================================
  
  # Build API Gateway
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/api-gateway:$COMMIT_SHA', '-f', 'Backend/api_gateway/Dockerfile.cloud', 'Backend']
    id: 'build-api-gateway'

  # Build RF Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/model-rf:$COMMIT_SHA', '-f', 'Backend/services/model_rf/Dockerfile.cloud', 'Backend']
    id: 'build-rf'

  # Build LSTM Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/model-lstm:$COMMIT_SHA', '-f', 'Backend/services/model_lstm/Dockerfile.cloud', 'Backend']
    id: 'build-lstm'

  # Build XGBoost Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/model-xgb:$COMMIT_SHA', '-f', 'Backend/services/model_xgb/Dockerfile.cloud', 'Backend']
    id: 'build-xgb'

  # Build Prophet Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/model-prophet:$COMMIT_SHA', '-f', 'Backend/services/model_prophet/Dockerfile.cloud', 'Backend']
    id: 'build-prophet'

  # Build SHAP Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/shap-explainer:$COMMIT_SHA', '-f', 'Backend/services/shap_explainer/Dockerfile.cloud', 'Backend']
    id: 'build-shap'

  # Build Ensemble Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/model-ensemble:$COMMIT_SHA', '-f', 'Backend/services/model_ensemble/Dockerfile.cloud', 'Backend']
    id: 'build-ensemble'

  # =============================================================================
  # Push Images to Container Registry
  # =============================================================================
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/api-gateway:$COMMIT_SHA']
    id: 'push-api-gateway'
    waitFor: ['build-api-gateway']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/model-rf:$COMMIT_SHA']
    id: 'push-rf'
    waitFor: ['build-rf']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/model-lstm:$COMMIT_SHA']
    id: 'push-lstm'
    waitFor: ['build-lstm']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/model-xgb:$COMMIT_SHA']
    id: 'push-xgb'
    waitFor: ['build-xgb']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/model-prophet:$COMMIT_SHA']
    id: 'push-prophet'
    waitFor: ['build-prophet']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/shap-explainer:$COMMIT_SHA']
    id: 'push-shap'
    waitFor: ['build-shap']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/model-ensemble:$COMMIT_SHA']
    id: 'push-ensemble'
    waitFor: ['build-ensemble']

  # =============================================================================
  # Deploy to Cloud Run - Model Services First
  # =============================================================================
  
  # Deploy RF Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'model-rf'
      - '--image=gcr.io/$PROJECT_ID/model-rf:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=600'
      - '--concurrency=10'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=GCS_BUCKET_NAME=${_GCS_BUCKET},GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - '--no-allow-unauthenticated'
    id: 'deploy-rf'
    waitFor: ['push-rf']

  # Deploy LSTM Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'model-lstm'
      - '--image=gcr.io/$PROJECT_ID/model-lstm:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=900'
      - '--concurrency=5'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--set-env-vars=GCS_BUCKET_NAME=${_GCS_BUCKET},GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - '--no-allow-unauthenticated'
    id: 'deploy-lstm'
    waitFor: ['push-lstm']

  # Deploy XGBoost Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'model-xgb'
      - '--image=gcr.io/$PROJECT_ID/model-xgb:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=600'
      - '--concurrency=10'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=GCS_BUCKET_NAME=${_GCS_BUCKET},GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - '--no-allow-unauthenticated'
    id: 'deploy-xgb'
    waitFor: ['push-xgb']

  # Deploy Prophet Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'model-prophet'
      - '--image=gcr.io/$PROJECT_ID/model-prophet:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=600'
      - '--concurrency=10'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=GCS_BUCKET_NAME=${_GCS_BUCKET},GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - '--no-allow-unauthenticated'
    id: 'deploy-prophet'
    waitFor: ['push-prophet']

  # Deploy SHAP Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'shap-explainer'
      - '--image=gcr.io/$PROJECT_ID/shap-explainer:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=120'
      - '--concurrency=20'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=GCS_BUCKET_NAME=${_GCS_BUCKET},GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - '--no-allow-unauthenticated'
    id: 'deploy-shap'
    waitFor: ['push-shap']

  # Deploy Ensemble Service (depends on other model services)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'model-ensemble'
      - '--image=gcr.io/$PROJECT_ID/model-ensemble:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=180'
      - '--concurrency=50'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--no-allow-unauthenticated'
    id: 'deploy-ensemble'
    waitFor: ['push-ensemble', 'deploy-rf', 'deploy-lstm', 'deploy-xgb', 'deploy-prophet']

  # =============================================================================
  # Get Service URLs and Deploy API Gateway
  # =============================================================================
  
  # Deploy API Gateway with service URLs
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        # Get Cloud Run service URLs
        RF_URL=$(gcloud run services describe model-rf --region=${_REGION} --format='value(status.url)')
        LSTM_URL=$(gcloud run services describe model-lstm --region=${_REGION} --format='value(status.url)')
        XGB_URL=$(gcloud run services describe model-xgb --region=${_REGION} --format='value(status.url)')
        PROPHET_URL=$(gcloud run services describe model-prophet --region=${_REGION} --format='value(status.url)')
        SHAP_URL=$(gcloud run services describe shap-explainer --region=${_REGION} --format='value(status.url)')
        ENSEMBLE_URL=$(gcloud run services describe model-ensemble --region=${_REGION} --format='value(status.url)')
        
        # Deploy API Gateway with all service URLs
        gcloud run deploy api-gateway \
          --image=gcr.io/$PROJECT_ID/api-gateway:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --memory=1Gi \
          --cpu=1 \
          --timeout=300 \
          --concurrency=100 \
          --min-instances=0 \
          --max-instances=10 \
          --allow-unauthenticated \
          --set-env-vars="RF_SERVICE_URL=$RF_URL,LSTM_SERVICE_URL=$LSTM_URL,XGB_SERVICE_URL=$XGB_URL,PROPHET_SERVICE_URL=$PROPHET_URL,SHAP_SERVICE_URL=$SHAP_URL,ENSEMBLE_SERVICE_URL=$ENSEMBLE_URL"
    id: 'deploy-api-gateway'
    waitFor: ['push-api-gateway', 'deploy-rf', 'deploy-lstm', 'deploy-xgb', 'deploy-prophet', 'deploy-shap', 'deploy-ensemble']

images:
  - 'gcr.io/$PROJECT_ID/api-gateway:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/model-rf:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/model-lstm:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/model-xgb:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/model-prophet:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/shap-explainer:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/model-ensemble:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 3600s
